# Applies to the root project as well as every subproject. EJML hit a publishing bug when
# only subprojects had `group` set (ejml 46f3765a), which declaring it here avoids.
group = org.boofcv
version = 1.5.1-SNAPSHOT

# Single source of truth for the Kotlin version. It has to live here rather than in
# buildSrc/Versions.kt because settings.gradle.kts pluginManagement needs it, and a
# pluginManagement block cannot read buildSrc. Gradle exposes it to settings via
# `by settings` and to every project as an ordinary project property.
kotlinVersion=2.3.0

org.gradle.parallel=true

org.gradle.jvmargs=--add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

#------- Needed for Android

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# https://stackoverflow.com/questions/71044526/your-project-has-set-android-useandroidx-true-but-configuration-debugruntimec
android.enableJetifier=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false
android.enableR8.fullMode=false